{{define "layout"}}<!DOCTYPE html>
<html lang="{{.Lang}}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gorillo - Radio Log</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/htmx.org@2.0.4"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <style>
        .field-error { background-color: #fef2f2; border-color: #fca5a5; }
        .suggest-dropdown { position: absolute; z-index: 50; background: white; border: 1px solid #e5e7eb; border-radius: 0.375rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,.1); max-height: 200px; overflow-y: auto; }
        .suggest-item:hover { background-color: #dbeafe; }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <nav class="bg-white shadow-sm border-b">
        <div class="max-w-7xl mx-auto px-4">
            <div class="flex items-center justify-between h-14">
                <div class="flex items-center space-x-1">
                    <div class="mr-6">
                        <span class="text-lg font-bold text-gray-800">Gorillo</span>
                        <span class="text-xs text-gray-400 ml-1">{{call .T "app.subtitle"}}</span>
                    </div>
                    <a href="/journal"
                       class="px-3 py-2 rounded-md text-sm font-medium {{if eqs .Active "journal"}}bg-blue-100 text-blue-700{{else}}text-gray-600 hover:bg-gray-100{{end}}">
                        {{call .T "nav.journal"}}
                    </a>
                    <a href="/logs"
                       class="px-3 py-2 rounded-md text-sm font-medium {{if eqs .Active "logs"}}bg-blue-100 text-blue-700{{else}}text-gray-600 hover:bg-gray-100{{end}}">
                        {{call .T "nav.logs"}}
                    </a>
                    <a href="/settings"
                       class="px-3 py-2 rounded-md text-sm font-medium {{if eqs .Active "settings"}}bg-blue-100 text-blue-700{{else}}text-gray-600 hover:bg-gray-100{{end}}">
                        {{call .T "nav.settings"}}
                    </a>
                </div>
            </div>
        </div>
    </nav>
    <main class="max-w-7xl mx-auto px-4 py-6">
        {{template "content" .}}
    </main>
    <script src="/static/js/app.js"></script>
</body>
</html>{{end}}
